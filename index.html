<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Chị Yêu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #ffe4e1; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .decor-ribbon { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: url('https://icons8.com') repeat-x; background-size: contain; z-index: 10; }
        #screen1 { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #fff0f5, #ffe4e1); transition: all 1s ease; }
        .box-container { width: 180px; height: 180px; perspective: 600px; cursor: pointer; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(45deg); transition: transform 1s ease; }
        .face { position: absolute; width: 180px; height: 180px; background: #ffb6c1; border: 3px solid #ffb6c1; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 16px; border-radius: 5px; box-shadow: inset 0 0 20px rgba(255,255,255,0.6); }
        .front { transform: translateZ(90px); background: #ffb6c1 url('https://icons8.com') no-repeat center; background-size: 50%; }
        .back { transform: rotateY(180deg) translateZ(90px); }
        .right { transform: rotateY(90deg) translateZ(90px); }
        .left { transform: rotateY(-90deg) translateZ(90px); }
        .top { transform: rotateX(90deg) translateZ(90px); background: #ffc0cb; }
        .bottom { transform: rotateX(-90deg) translateZ(90px); background: #ff99aa; }
        .face::after { content: ''; position: absolute; background: #ff1493; }
        .front::after, .back::after, .left::after, .right::after { width: 25px; height: 100%; top: 0; left: 78px; }
        .top::after { width: 25px; height: 100%; top: 0; left: 78px; }
        .hint-text { margin-top: 40px; color: #d81b60; font-size: 16px; font-weight: bold; animation: bounce 1.5s infinite; text-shadow: 1px 1px #fff; text-align: center; padding: 0 20px; }
        #screen2 { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff0f5; opacity: 0; pointer-events: none; transition: all 1s ease; z-index: 2; }
        .title-banner { font-size: 32px; color: #ff2a75; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px #fff; text-align: center; }
        .cake-wrapper { position: relative; width: 280px; height: 220px; display: flex; justify-content: center; align-items: flex-end; }
        .cake-top { width: 240px; height: 60px; background: #fff; border-radius: 50%; position: absolute; top: 100px; border: 2px solid #ffb6c1; display: flex; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .candle { width: 10px; height: 45px; background: linear-gradient(to right, #6495ed, #b0c4de); position: absolute; bottom: 65px; left: 135px; border-radius: 3px; z-index: 5; }
        .flame { width: 10px; height: 18px; background: radial-gradient(circle, #ffeedd, #ff8c00, #ff4500); border-radius: 50% 50% 20% 20%; position: absolute; top: -15px; left: 0; animation: flicker 0.6s infinite alternate; box-shadow: 0 0 15px #ff8c00; }
        .btn-action { margin-top: 40px; padding: 12px 30px; background: linear-gradient(135deg, #ff69b4, #ff1493); color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,20,147,0.4); }
        .slice-line { position: absolute; background: rgba(255, 255, 255, 0.9); z-index: 10; pointer-events: none; display: none; }
        .slice-1 { width: 4px; height: 180px; transform: rotate(45deg); left: 138px; top: 40px; }
        .slice-2 { width: 4px; height: 180px; transform: rotate(-45deg); left: 138px; top: 40px; }
        .slice-3 { width: 180px; height: 4px; left: 50px; top: 128px; }
        .cake-split { animation: splitCake 0.8s forwards ease-in-out; }
        #screen3 { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px 10px 20px; background: #fff5f5; opacity: 0; pointer-events: none; transition: all 1s ease; z-index: 3; }
        .film-strip { display: flex; width: 180%; animation: scrollFilm 15s linear infinite; background: #333; padding: 8px 0; border-top: 3px dashed #fff; border-bottom: 3px dashed #fff; }
        .film-frame { width: 120px; height: 90px; background: #fff; margin: 0 5px; flex-shrink: 0; overflow: hidden; }
        .film-frame img { width: 100%; height: 100%; object-fit: cover; }
        .envelope-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .envelope { width: 90px; height: 60px; background: #ffb6c1; border-radius: 0 0 5px 5px; position: relative; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.15); display: flex; justify-content: center; align-items: center; }
        .envelope-top { position: absolute; top: -40px; left: 0; border-left: 45px solid transparent; border-right: 45px solid transparent; border-bottom: 40px solid #ffb6c1; transform: rotate(180deg); transform-origin: bottom; }
        .heart-seal { font-size: 20px; color: #ff1493; z-index: 5; }
        .letter-box { width: 95%; height: 0; background: #fffdf9; border: 2px solid #ffb6c1; border-radius: 10px; padding: 0 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow-y: auto; transition: all 0.8s ease; opacity: 0; line-height: 2em; }
        .letter-content { font-size: 14px; color: #4a3728; text-align: justify; white-space: pre-wrap; font-family: monospace; font-weight: bold; }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1) rotate(3deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10deg); } }
        @keyframes scrollFilm { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes splitCake { to { transform: scale(0.85) translateY(15px); opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="decor-ribbon"></div>
    <audio id="bg-music" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <div id="screen1">
        <div class="box-container" onclick="openBox()">
            <div class="cube" id="gift-cube">
                <div class="face front"></div><div class="face back"></div><div class="face right"></div><div class="face left"></div>
                <div class="face top">BẤM VÀO ĐÂY</div><div class="face bottom"></div>
            </div>
        </div>
        <div class="hint-text">Chạm vào hộp quà để mở điều bất ngờ cho ngày sinh nhật chị yêu! ✨</div>
    </div>

    <div id="screen2">
        <div class="title-banner" id="banner-text">HAPPY BIRTHDAY!</div>
        <div class="cake-wrapper">
            <div class="candle" id="candle-id"><div class="flame" id="flame-id"></div></div>
            <div class="cake-top" id="cake-main">
                <div style="margin-top: 20px; color: #ff1493; font-weight: bold; font-size: 12px; text-align:center;">Chúc mừng sinh nhật Chị Gái! ❤️</div>
            </div>
            <div class="slice-line slice-1" id="s1"></div><div class="slice-line slice-2" id="s2"></div><div class="slice-line slice-3" id="s3"></div>
        </div>
        <button class="btn-action" id="action-btn" onclick="handleCakeAction()">🔥 THỔI NẾN</button>
    </div>

    <div id="screen3">
        <div class="film-strip">
            <!-- Hình ảnh trang trí dễ thương mặc định, bạn có thể đổi link ảnh sau nếu muốn -->
            <div class="film-frame"><img src="https://unsplash.com"></div>
            <div class="film-frame"><img src="https://unsplash.com"></div>
            <div class="film-frame"><img src="https://unsplash.com"></div>
            <div class="film-frame"><img src="https://unsplash.com"></div>
            <div class="film-frame"><img src="https://unsplash.com"></div>
        </div>
        <div class="envelope-wrapper">
            <div class="envelope" id="envelope-id" onclick="openLetter()">
                <div class="envelope-top" id="env-top"></div><div class="heart-seal">❤️</div>
            </div>
            <div style="margin-top: 15px; color: #db2777; font-weight: bold; font-size:14px; text-align:center;" id="env-hint">Chạm vào phong thư để đọc bức thư em viết...</div>
        </div>
        <div class="letter-box" id="letter-box-id"><div class="letter-content" id="typewriter-text"></div></div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        let cakeStep = 0;
Hãy thận trọng khi sử dụng mã.
const letterMsg = GỬI CHỊ GÁI CỦA EM – NGƯỜI MÀ EM LUÔN TRÂN TRỌNG\n\nChị à!\n\nVậy là lại thêm một tuổi mới đến với chị. Sinh nhật năm nay, em không thể ở gần chị như trước, không thể trực tiếp gửi chị một lời chúc, cũng chẳng thể tự tay chuẩn bị một món quà nhỏ để chị bất ngờ. Nghĩ đến điều đó, em có chút tiếc nuối, bởi đôi khi em nhận ra rằng khoảng cách không chỉ được đo bằng những con đường xa xôi, mà còn là những khoảnh khắc mình muốn có mặt bên cạnh một người nhưng lại chẳng thể.\n\nEm nhớ chị, nhớ những lúc hai chị em có thể ở gần nhau, nhớ cả những câu chuyện tưởng chừng chẳng có gì đặc biệt. Có lẽ khi còn ở gần, em đã không nhận ra hết giá trị của những điều bình dị ấy. Chỉ đến khi mỗi người ở một nơi, em mới hiểu rằng có những sự hiện diện vốn dĩ rất đỗi thân quen, nhưng lại trở thành điều khiến người ta nhớ nhung nhiều nhất.\n\nEm muốn cảm ơn chị, không chỉ vì những gì chị đã làm cho em, mà còn vì cách chị luôn dành cho em một sự tin tưởng và kiên nhẫn rất đỗi đặc biệt. Cảm ơn chị vì đã luôn lắng nghe những câu chuyện của em, từ những điều nhỏ nhặt chẳng đầu chẳng cuối cho đến những tâm sự mà đôi khi chính em cũng chẳng biết phải diễn đạt thế nào. Cảm ơn chị vì chưa bao giờ khiến em cảm thấy những suy nghĩ, cảm xúc của mình là điều phiền phức hay không đáng được quan tâm. Được thoải mái chia sẻ, được lắng nghe và được tin tưởng như thế là một điều em luôn trân trọng.\n\nCó lẽ em không thường xuyên nói ra, nhưng em thực sự biết ơn vì trong cuộc đời mình có một người chị như chị. Một người mà em có thể tìm đến để kể chuyện, để giãi bày, để được là chính mình mà không phải đắn đo quá nhiều. Em nghĩ rằng không phải tình cảm nào cũng cần được thể hiện bằng những điều lớn lao; đôi khi, chỉ cần một người sẵn lòng lắng nghe mình giữa bộn bề cuộc sống cũng đã là một món quà vô cùng quý giá rồi.\n\nBước sang tuổi mới, em mong chị sẽ có thật nhiều bình yên, nhưng không phải là thứ bình yên được đánh đổi bằng việc phải chịu đựng hay giấu đi những mệt mỏi của bản thân. Em mong chị có đủ sức khỏe để tận hưởng những điều mình yêu thích, đủ mạnh mẽ để vượt qua những ngày không như ý và đủ dịu dàng với chính mình sau tất cả những cố gắng. Mong những điều tốt đẹp mà chị từng âm thầm hy vọng sẽ dần trở thành hiện thực; mong chị luôn gặp được những người chân thành, được yêu thương đúng cách và được trân trọng xứng đáng với những gì chị đã trao đi.\n\nEm cũng mong chị đừng lúc nào cũng phải tỏ ra mạnh mẽ, đừng vì bận tâm đến mọi người mà quên mất việc chăm sóc bản thân. Chị cũng xứng đáng được lắng nghe, được sẻ chia và được dựa vào ai đó khi mệt mỏi. Và nếu có những ngày chị cần một người để tâm sự, em hy vọng mình vẫn luôn là một trong những người mà chị có thể nghĩ đến.\n\nKhoảng cách có thể khiến chúng ta không còn dễ dàng gặp nhau, nhưng em mong nó sẽ không bao giờ làm vơi đi sự gắn bó giữa hai chị em. Dù không thể xuất hiện bên chị trong mọi khoảnh khắc, em vẫn luôn mong chị sống thật tốt, thật vui và có một cuộc đời mà khi nhìn lại, chị sẽ cảm thấy tự hào và hạnh phúc.\n\nChúc mừng sinh nhật chị gái của em! Cảm ơn chị vì đã là chị, vì đã tin tưởng, lắng nghe và dành cho em một vị trí thân thương trong cuộc sống của chị. Mong tuổi mới sẽ đối xử với chị thật dịu dàng. Chúc chị không chỉ có thêm một tuổi mới, mà còn có thêm thật nhiều lý do để yêu cuộc sống, yêu bản thân và mỉm cười mỗi ngày.\n\nThương chị nhiều! ❤️;
function openBox() {
document.getElementById('gift-cube').style.transform = "scale(0)";
music.play().catch(e => console.log("Music play blocked"));
setTimeout(() => {
document.getElementById('screen1').style.opacity = "0";
document.getElementById('screen1').style.pointerEvents = "none";
const s2 = document.getElementById('screen2');
s2.style.opacity = "1"; s2.style.pointerEvents = "auto";
}, 600);
}
function handleCakeAction() {
const actionBtn = document.getElementById('action-btn');
if (cakeStep === 0) {
document.getElementById('flame-id').style.display = 'none';
document.getElementById('banner-text').innerText = "HÃY CẮT BÁNH KEM!";
actionBtn.innerText = "🔪 CẮT BÁNH KHÁNH THÀNH";
cakeStep = 1;
} else if (cakeStep === 1) {
document.getElementById('s1').style.display = 'block';
setTimeout(() => document.getElementById('s2').style.display = 'block', 200);
setTimeout(() => document.getElementById('s3').style.display = 'block', 400);
setTimeout(() => {
document.getElementById('cake-main').classList.add('cake-split');
document.getElementById('candle-id').style.display = 'none';
}, 600);
setTimeout(() => {
document.getElementById('screen2').style.opacity = "0";
document.getElementById('screen2').style.pointerEvents = "none";
const s3 = document.getElementById('screen3');
s3.style.opacity = "1"; s3.style.pointerEvents = "auto";
}, 1500);
}
}
function openLetter() {
document.getElementById('env-top').style.transform = 'rotateX(0deg)';
document.getElementById('envelope-id').style.display = 'none';
document.getElementById('env-hint').style.display = 'none';
const letterBox = document.getElementById('letter-box-id');
letterBox.style.height = '65vh'; letterBox.style.opacity = '1'; letterBox.style.padding = '15px';
setTimeout(() => { typeWriter(letterMsg, 0); }, 500);
}
function typeWriter(text, i) {
if (i < text.length) {
document.getElementById("typewriter-text").innerHTML += text.charAt(i);
document.getElementById('letter-box-id').scrollTop = document.getElementById('letter-box-id').scrollHeight;
setTimeout(() => { typeWriter(text, i + 1); }, 40);
}
}
